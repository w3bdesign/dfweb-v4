name: Code Quality

# Enforces the hard rules for agents: code style (Prettier, Stylelint) and
# structure/architecture (Jest tests in src/__tests__/architecture).

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Style and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@2e223e0f0d2b8fd9872cbadb8b7428e5f8b5556d

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Lint CSS (Stylelint)
        run: pnpm lint:css

      - name: Architecture tests (naming and import boundaries)
        env:
          NODE_OPTIONS: --no-experimental-strip-types
        run: pnpm exec jest src/__tests__/architecture --coverage=false
