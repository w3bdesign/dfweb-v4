name: Snyk Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual trigger for the one-off cleanup of stale Snyk code scanning
  # configurations left on main by the previous auto-generated category names.
  workflow_dispatch:
    inputs:
      cleanup_stale_configurations:
        description: "Delete stale Snyk code scanning configurations on main"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  snyk_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@2e223e0f0d2b8fd9872cbadb8b7428e5f8b5556d

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install studio dependencies
        run: cd studio && npm ci --ignore-scripts --legacy-peer-deps

      # Each Snyk scan targets a single manifest so that every SARIF file
      # contains exactly one run. `--all-projects` emits one run per detected
      # project, which the CodeQL upload action rejects under a single category.
      #
      # `snyk test` exits non-zero when it finds issues at or above the
      # threshold. Without `continue-on-error` + `if: always()` the first
      # failing scan would abort the remaining scans, leaving their SARIF
      # files (and therefore their code scanning configurations) missing.
      # GitHub then reports "configurations present on main were not found"
      # on pull requests. Every scan must run and every SARIF must upload.
      - name: Run Snyk to check main project vulnerabilities
        id: snyk_main
        continue-on-error: true
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: "test"
          args: "--file=package.json --sarif-file-output=snyk-main.sarif --severity-threshold=high"

      - name: Run Snyk to check studio vulnerabilities
        id: snyk_studio
        if: always()
        continue-on-error: true
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: "test"
          args: "--file=studio/package.json --sarif-file-output=snyk-studio.sarif --severity-threshold=high"

      - name: Run Snyk to check eslint plugin vulnerabilities
        id: snyk_eslint
        if: always()
        continue-on-error: true
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: "test"
          args: "--file=src/utils/eslint/package.json --sarif-file-output=snyk-eslint.sarif --severity-threshold=high"

      # Two things are normalized here, both required for stable configurations:
      #
      # 1. Snyk writes `runs[].automationDetails.id` itself, e.g.
      #    "Snyk/Open Source/dfweb-v4/0". `github/codeql-action/upload-sarif`
      #    only applies its `category` input when `automationDetails` is
      #    ABSENT, so Snyk's value wins and becomes the code scanning
      #    configuration name. That name embeds a project index that shifts
      #    between runs, so main collects orphaned configurations like
      #    "Snyk/Open Source/dfweb-v4/0" that later runs never reproduce -
      #    producing the "configurations present on main were not found"
      #    warning on every pull request. Deleting `automationDetails` lets the
      #    explicit `category` below take effect and stay constant forever.
      #
      # 2. A SARIF file must always be uploaded for every category, even when a
      #    scan crashed, otherwise that configuration vanishes from the branch
      #    and code scanning can no longer diff pull requests against main.
      - name: Normalize SARIF output for stable code scanning categories
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          normalize() {
            local file="$1" label="$2"

            if [ ! -s "$file" ]; then
              echo "::warning::${file} missing - writing empty placeholder SARIF for ${label}"
              jq -n '{
                "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                version: "2.1.0",
                runs: [{
                  tool: { driver: { name: "Snyk Open Source", informationUri: "https://snyk.io", rules: [] } },
                  results: []
                }]
              }' > "$file"
              return
            fi

            local runs
            runs=$(jq '.runs | length' "$file")
            if [ "$runs" -ne 1 ]; then
              echo "::error::${file} contains ${runs} runs but exactly 1 is required; a single --file scan must not fan out"
              exit 1
            fi

            jq 'del(.runs[].automationDetails)' "$file" > "${file}.normalized"
            mv "${file}.normalized" "$file"
            echo "Normalized ${file} for ${label}"
          }

          normalize snyk-main.sarif "main project"
          normalize snyk-studio.sarif "studio"
          normalize snyk-eslint.sarif "eslint plugin"

      - name: Upload main project SARIF report to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: snyk-main.sarif
          category: snyk-main

      - name: Upload studio SARIF report to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: snyk-studio.sarif
          category: snyk-studio

      - name: Upload eslint plugin SARIF report to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: snyk-eslint.sarif
          category: snyk-eslint

      - name: Fail if any Snyk scan reported issues
        if: always()
        shell: bash
        env:
          MAIN_RESULT: ${{ steps.snyk_main.outcome }}
          STUDIO_RESULT: ${{ steps.snyk_studio.outcome }}
          ESLINT_RESULT: ${{ steps.snyk_eslint.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for scan in "main:$MAIN_RESULT" "studio:$STUDIO_RESULT" "eslint:$ESLINT_RESULT"; do
            name="${scan%%:*}"
            outcome="${scan##*:}"
            if [ "$outcome" = "failure" ]; then
              echo "::error::Snyk scan failed for ${name}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Snyk Monitor main project (only for pushes to main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: "monitor"
          args: "--all-projects"

      - name: Snyk Monitor eslint plugin (only for pushes to main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: "monitor"
          args: "--file=src/utils/eslint/package.json"

  # Renaming the categories stops NEW stale configurations from appearing, but
  # the ones already recorded on main ("Snyk/Open Source/dfweb-v4/0", "/2",
  # "eslint-plugin-test-rules/0", "/1") stay registered until their analyses
  # are deleted. Until then every pull request keeps reporting
  # "configurations present on refs/heads/main were not found".
  # Run this job once from the Actions tab with the input enabled.
  cleanup_stale_configurations:
    if: github.event_name == 'workflow_dispatch' && inputs.cleanup_stale_configurations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Delete stale Snyk analyses from refs/heads/main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Categories the workflow publishes today. Anything else from the
          # Snyk tool on main is stale and must go.
          KEEP: "snyk-main snyk-studio snyk-eslint"
        run: |
          set -euo pipefail

          is_kept() {
            local category="$1" keep
            for keep in $KEEP; do
              # Code scanning stores categories with a trailing "/".
              [ "${category%/}" = "$keep" ] && return 0
            done
            return 1
          }

          deleted=0
          # Deleting an analysis can expose an older one in the same
          # configuration, so loop until no stale analyses remain.
          for _ in $(seq 1 50); do
            stale=$(
              gh api \
                --paginate \
                "repos/${REPO}/code-scanning/analyses?ref=refs/heads/main&tool_name=Snyk%20Open%20Source&per_page=100" \
                --jq '.[] | "\(.id) \(.category)"'
            )

            target=""
            while read -r id category; do
              [ -z "${id:-}" ] && continue
              if ! is_kept "${category:-}"; then
                target="$id"
                echo "Stale analysis ${id} (category: ${category:-<none>})"
                break
              fi
            done <<< "$stale"

            if [ -z "$target" ]; then
              echo "No stale Snyk analyses remain on main."
              break
            fi

            # confirm_delete is required when removing the last analysis of a
            # configuration, which is exactly what retires the configuration.
            gh api --method DELETE \
              "repos/${REPO}/code-scanning/analyses/${target}?confirm_delete=true" > /dev/null
            deleted=$((deleted + 1))
            echo "Deleted analysis ${target}"
          done

          echo "Deleted ${deleted} stale Snyk analyses."
