name: Snyk Security Scan
on: push

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        continue-on-error: true # To make sure that SARIF upload gets called
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # --all-projects is required: the Snyk CLI refuses to run when both
          # pnpm-lock.yaml and pnpm-workspace.yaml are present at the repo root
          # (SNYK-CLI-0000). Without it no SARIF is produced and the upload
          # below fails with "Path does not exist: snyk.sarif".
          args: --all-projects --sarif-file-output=snyk.sarif
      - name: Collapse SARIF to a single run with a pinned category
        if: hashFiles('snyk.sarif') != ''
        shell: bash
        run: |
          set -euo pipefail
          # --all-projects emits one run per manifest, all sharing the tool name
          # "Snyk Open Source". Since 2025-07-21 upload-sarif rejects multiple
          # runs in the same category instead of merging them.
          #
          # upload-sarif's `category:` input is IGNORED when the SARIF already
          # carries automationDetails (Snyk always writes it), so the id must be
          # pinned here. Snyk's default ids are index-based ("dfweb-v4/0") and
          # shift whenever manifests change, orphaning the branch baseline.
          #
          # del(.ruleIndex): merging per-run rule arrays invalidates positional
          # indices; results still resolve via rule.id.
          jq '
            . as $sarif
            | .runs = [
                $sarif.runs[0]
                | .automationDetails = { id: "snyk-open-source" }
                | .tool.driver.rules = (
                    [$sarif.runs[] | (.tool.driver.rules // [])[]] | unique_by(.id)
                  )
                | .results = [
                    $sarif.runs[] | (.results // [])[] | del(.ruleIndex)
                  ]
              ]
          ' snyk.sarif > snyk.sarif.tmp
          mv snyk.sarif.tmp snyk.sarif
      - name: Upload result to GitHub Code Scanning
        if: hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          sarif_file: snyk.sarif
          category: snyk-open-source