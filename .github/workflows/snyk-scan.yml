name: Snyk Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  snyk_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@2e223e0f0d2b8fd9872cbadb8b7428e5f8b5556d

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install studio dependencies
        run: cd studio && npm ci --ignore-scripts --legacy-peer-deps

      - name: Run Snyk to check main project vulnerabilities
        uses: snyk/actions/node@9cf6ca713d71123d2d229cc3d7f145b96ea3c518 # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: "test"
          args: "--all-projects --sarif-file-output=snyk-main.sarif --severity-threshold=high"

      - name: Run Snyk to check eslint plugin vulnerabilities
        uses: snyk/actions/node@9cf6ca713d71123d2d229cc3d7f145b96ea3c518 # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: "test"
          args: "--file=src/utils/eslint/package.json --sarif-file-output=snyk-eslint.sarif --severity-threshold=high"

      - name: Upload main project SARIF report to GitHub Security tab
        if: always() && hashFiles('snyk-main.sarif') != ''
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        with:
          sarif_file: snyk-main.sarif
          category: snyk-main

      - name: Upload eslint plugin SARIF report to GitHub Security tab
        if: always() && hashFiles('snyk-eslint.sarif') != ''
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        with:
          sarif_file: snyk-eslint.sarif
          category: snyk-eslint

      - name: Snyk Monitor main project (only for pushes to main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@9cf6ca713d71123d2d229cc3d7f145b96ea3c518 # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: "monitor"
          args: "--all-projects"

      - name: Snyk Monitor eslint plugin (only for pushes to main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@9cf6ca713d71123d2d229cc3d7f145b96ea3c518 # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: "monitor"
          args: "--file=src/utils/eslint/package.json"
