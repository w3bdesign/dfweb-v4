name: Snyk Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Snyk to check for vulnerabilities
        id: snyk
        # Snyk exits non-zero on findings, which would skip the SARIF upload.
        # The final step re-fails the job so vulnerabilities still block merges.
        continue-on-error: true
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # --all-projects is required: the Snyk CLI refuses to run when both
          # pnpm-lock.yaml and pnpm-workspace.yaml are present at the repo root.
          # It also makes Snyk emit one SARIF run per manifest, which the next
          # step collapses into one.
          args: --all-projects --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Collapse SARIF to a single run with a pinned category
        if: always() && hashFiles('snyk.sarif') != ''
        shell: bash
        run: |
          set -euo pipefail
          # GitHub rejects multiple runs sharing a tool + category in one file.
          # It also IGNORES upload-sarif's `category:` input when the SARIF
          # already carries automationDetails (Snyk always writes it), so the
          # id must be pinned here. Index-based ids like "dfweb-v4/0" shift when
          # manifests change and orphan the branch baseline.
          # del(.ruleIndex): merging per-run rule arrays invalidates positional
          # indices; results still resolve via rule.id.
          jq '
            . as $sarif
            | .runs = [
                $sarif.runs[0]
                | .automationDetails = { id: "snyk-open-source" }
                | .tool.driver.rules = (
                    [$sarif.runs[] | (.tool.driver.rules // [])[]] | unique_by(.id)
                  )
                | .results = [
                    $sarif.runs[] | (.results // [])[] | del(.ruleIndex)
                  ]
              ]
          ' snyk.sarif > snyk.sarif.tmp
          mv snyk.sarif.tmp snyk.sarif

      - name: Upload result to GitHub Code Scanning
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: snyk.sarif
          category: snyk-open-source

      - name: Fail on high severity vulnerabilities
        if: steps.snyk.outcome == 'failure'
        run: |
          echo "::error::Snyk found high severity vulnerabilities. See the Security tab."
          exit 1