name: Cypress Tests
on: [push]

permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@2e223e0f0d2b8fd9872cbadb8b7428e5f8b5556d

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Cypress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify and install Cypress binary
        # Uses cypress@15.14.1 from lockfile (specified in package.json).
        # `cypress install` is the Cypress CLI downloading its pre-vetted binary,
        # NOT a package-manager install running third-party lifecycle scripts.
        # Dependency lifecycle scripts remain blocked by ignore-scripts=true in .npmrc
        # and the allowBuilds whitelist in pnpm-workspace.yaml.
        run: pnpm exec cypress verify || pnpm exec cypress install # NOSONAR

      - name: Build the project
        run: pnpm build

      - name: Start the application
        run: pnpm dev &

      - name: Wait for the application to be ready
        run: pnpm dlx wait-on@8.0.1 http://localhost:3000 --timeout 120000

      - name: Run Cypress tests
        run: pnpm exec cypress run --browser ${{ matrix.browser }}
