name: Cypress Tests
on: [push]

permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@2e223e0f0d2b8fd9872cbadb8b7428e5f8b5556d

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Cypress binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify and install Cypress binary
        # Uses cypress@15.14.1 from lockfile (specified in package.json).
        # `cypress install` is the Cypress CLI downloading its pre-vetted binary,
        # NOT a package-manager install running third-party lifecycle scripts.
        # Dependency lifecycle scripts remain blocked by ignore-scripts=true in .npmrc
        # and the allowBuilds whitelist in pnpm-workspace.yaml.
        run: pnpm exec cypress verify || pnpm exec cypress install # NOSONAR

      - name: Build the project
        run: pnpm build

      - name: Start the application
        run: pnpm dev &

      - name: Wait for the application to be ready
        run: pnpm dlx wait-on@8.0.1 http://localhost:3000 --timeout 120000

      - name: Run Cypress tests
        run: pnpm exec cypress run --browser ${{ matrix.browser }}
