# One-off maintenance workflow, manual trigger only.
#
# `snyk-scan.yml` used to upload SARIF with Snyk's own
# `runs[].automationDetails.id` left in place. `upload-sarif` only honours its
# `category` input when `automationDetails` is ABSENT, so Snyk's value won and
# became the code scanning configuration name:
#
#   Snyk/Open Source/dfweb-v4/0
#   Snyk/Open Source/dfweb-v4/2
#   Snyk/Open Source/eslint-plugin-test-rules/0
#   Snyk/Open Source/eslint-plugin-test-rules/1
#
# Those names embed a project index that shifts between runs, so main collected
# configurations that later runs never reproduce. `snyk-scan.yml` now strips
# `automationDetails` and publishes the stable categories `snyk-main`,
# `snyk-studio` and `snyk-eslint` instead — but the old configurations stay
# registered on main until their analyses are deleted, and until then every
# pull request reports "configurations present on refs/heads/main were not
# found". Run this workflow once from the Actions tab to retire them.
#
# This is deliberately a separate workflow rather than a conditional job in
# `snyk-scan.yml`: a job with an `if:` guard still registers as a (skipped)
# check on every pull request.
name: Snyk Cleanup Stale Configurations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List stale configurations without deleting them"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup_stale_configurations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Delete stale Snyk analyses from refs/heads/main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Categories snyk-scan.yml publishes today. Any other analysis from
          # the Snyk tool on main is stale and must be retired.
          KEEP: "snyk-main snyk-studio snyk-eslint"
        run: |
          set -euo pipefail

          api_path="repos/${REPO}/code-scanning/analyses?ref=refs/heads/main&tool_name=Snyk%20Open%20Source&per_page=100"

          is_kept() {
            local category="${1:-}" keep
            for keep in $KEEP; do
              # Code scanning stores categories with a trailing "/".
              if [ "${category%/}" = "$keep" ]; then
                return 0
              fi
            done
            return 1
          }

          find_stale() {
            local id category
            while read -r id category; do
              [ -z "${id:-}" ] && continue
              if ! is_kept "${category:-}"; then
                printf '%s %s\n' "$id" "${category:-<none>}"
              fi
            done < <(gh api --paginate "$api_path" --jq '.[] | "\(.id) \(.category)"')
          }

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run - the following stale analyses would be deleted:"
            find_stale || true
            echo
            echo "Re-run with dry_run disabled to delete them."
            exit 0
          fi

          deleted=0
          # Deleting an analysis can expose an older one in the same
          # configuration, so loop until no stale analyses remain.
          for _ in $(seq 1 200); do
            target=$(find_stale | head -n 1 || true)
            if [ -z "$target" ]; then
              echo "No stale Snyk analyses remain on main."
              break
            fi

            id="${target%% *}"
            category="${target#* }"
            echo "Deleting analysis ${id} (category: ${category})"

            # confirm_delete is required when removing the last analysis of a
            # configuration, which is exactly what retires the configuration.
            gh api --method DELETE \
              "repos/${REPO}/code-scanning/analyses/${id}?confirm_delete=true" > /dev/null

            deleted=$((deleted + 1))
          done

          echo "Deleted ${deleted} stale Snyk analyses."
