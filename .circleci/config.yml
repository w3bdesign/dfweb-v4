version: 2.1
orbs:
  codecov: codecov/codecov@6.0.0
  node: circleci/node@7.2.1
jobs:
  build:
    working_directory: /home/circleci/dfweb
    docker:
      - image: cimg/node:26.8.1-browsers
    steps:
      - checkout
      - restore_cache:
          key: pnpm-cache-v2-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm package manager
          command: sudo npm i -g pnpm@12.15.0
      - run:
          name: Install Dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Chrome key start setup
          command: sudo apt update -y
      - run:
          name: Chrome key finish setup
          command: wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
      - run:
          name: Chrome package download
          command: sudo apt install ./google-chrome-stable_current_amd64.deb
      - save_cache:
          key: pnpm-cache-v2-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - store_artifacts:
          path: /root/.npm/_logs
      - run:
          name: Run Vitest Tests
          command: pnpm test
      - run:
          name: Make sure ~/.gnupg directory exists
          command: mkdir -p ~/.gnupg
      - run:
          name: Fix GPG directory permissions
          command: |
            chmod 700 ~/.gnupg
            chmod 600 ~/.gnupg/* || true
      - run:
          name: Import Codecov GPG key
          command: |
            curl -s https://keybase.io/codecovsecops/pgp_keys.asc | gpg --import
      - run:
          name: Download and Verify Codecov CLI
          command: |
            curl -Os https://cli.codecov.io/latest/linux/codecov
            curl -Os https://cli.codecov.io/latest/linux/codecov.SHA256SUM
            curl -Os https://cli.codecov.io/latest/linux/codecov.SHA256SUM.sig
            gpg --verify codecov.SHA256SUM.sig codecov.SHA256SUM
            shasum -a 256 -c codecov.SHA256SUM
            sudo chmod +x codecov
      - run:
          name: Upload Coverage to Codecov
          command: |
            ./codecov upload-process --fail-on-error -t ${CODECOV_TOKEN}
workflows:
  build-and-test:
    jobs:
      - build:
          name: Build Next.js project
