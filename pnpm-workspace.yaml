packages:
  - '.'
overrides:
  "@babel/core": ">=8.0.1"
  "brace-expansion": "5.0.9"
  "js-yaml": ">=5.2.3"
  "sharp": ">=0.35.3"
  "adm-zip": ">=0.6.0"
  "nanoid": ">=6.0.1"
  "postcss": ">=8.5.26"
  # Align jest 30.3.x sub-packages to 30.4.x so jest-environment-jsdom
  # supplies a jest-mock with clearMocksOnScope (required by jest-runtime@30.4.2)
  "jest-mock": "30.4.1"
  "@jest/environment": "30.4.1"
  "@jest/fake-timers": "30.4.1"
  "jest-util": "30.4.1"
  "@jest/types": "30.4.1"
  # React requires react and react-dom to be the exact same version;
  # pin both to keep them in lockstep and avoid version-mismatch errors in tests
  "react": "19.2.8"
  "react-dom": "19.2.8"
allowBuilds:
  '@swc/core': true
  cypress: true
  esbuild: true
  msw: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.21
  - wait-on@9.1.0
  - eslint@10.8.1
